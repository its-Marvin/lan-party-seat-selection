name: Docker image

# Publishing a GitHub release (semver tag such as v1.2.3, on a commit that is on
# main) runs the tests and pushes :1.2.3, :1.2 and :1 to GHCR (pre-releases: only
# their own tag). Afterwards the serialised "latest" job points :latest at the
# image of whatever GitHub currently marks as the Latest release, so neither a fix
# for an older line nor parallel release runs can move it backwards.
# Pull requests only build the image; nothing is pushed.
on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # superseded PR builds can stop; a release publish always runs to the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  on-main:
    name: Release is on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the release tag and that the released commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag ${TAG} is not a semantic version like v1.2.3; no image is published."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release ${GITHUB_REF_NAME} points to a commit that is not on main; no image is published."
            exit 1
          fi

  tests:
    needs: on-main
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    # for pull requests, on-main and tests are skipped (the Tests workflow runs on their pushes)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # version tags only; :latest is set by the serialised job below
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  latest:
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # one group for the whole repository: :latest updates never overlap
    concurrency:
      group: docker-latest
      cancel-in-progress: false
    steps:
      - name: Image name (lowercase, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Not "is this run's release the latest?" but "make :latest match GitHub's
      # Latest release": whichever run gets here last leaves the right state.
      - name: Point :latest at GitHub's Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "No stable release yet (only pre-releases); :latest stays unset."
            exit 0
          fi
          version="${newest#v}"
          if ! docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "The image for ${newest} isn't published (yet); its own run sets :latest."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$version"
          echo "Set :latest to ${version}."
