name: Docker image

# Publishing a GitHub release (tag v1.2.3, on a commit that is on main) runs the
# tests and pushes :1.2.3, :1.2 and :1 to GHCR (pre-releases: only their own
# tag). :latest moves only with the release GitHub marks as "Latest", so a fix
# for an older line (v1.0.1 after v1.1.0) never moves it backwards.
# Pull requests only build the image; nothing is pushed.
on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # superseded PR builds can stop; a release publish always runs to the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  on-main:
    name: Release is on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the released commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release ${GITHUB_REF_NAME} points to a commit that is not on main; no image is published."
            exit 1
          fi

  tests:
    needs: on-main
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    # for pull requests, on-main and tests are skipped (the Tests workflow runs on their pushes)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this GitHub's "Latest" release?
        id: latest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$newest" = "$TAG" ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi

      # version tags come from the release tag; latest only from the step above
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ steps.latest.outputs.value == 'true' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
