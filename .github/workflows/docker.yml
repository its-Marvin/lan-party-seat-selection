name: Docker image

# Publishing a GitHub release (semver tag such as v1.2.3, on a commit that is on
# main) runs the tests and pushes :1.2.3 to GHCR. Afterwards the serialised
# "aliases" job reconciles every :X, :X.Y and :latest (.github/scripts/update-image-aliases.sh):
# each points at the newest published version it covers, so neither a fix for an
# older line nor parallel or replaced release runs can leave an alias wrong.
# Pull requests only build the image; nothing is pushed.
on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # superseded PR builds can stop; a release publish always runs to the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  on-main:
    name: Release is on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the release tag and that the released commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag ${TAG} is not a semantic version like v1.2.3; no image is published."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release ${GITHUB_REF_NAME} points to a commit that is not on main; no image is published."
            exit 1
          fi

  tests:
    needs: on-main
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    # for pull requests, on-main and tests are skipped (the Tests workflow runs on their pushes)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (lowercase, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # only the exact version; the alias tags are set by the serialised job below
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  aliases:
    name: Alias tags (:X.Y, :X, :latest)
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # one group for the whole repository: alias updates never overlap
    concurrency:
      group: docker-aliases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (lowercase, as GHCR requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # all lines, not just this release's: GitHub may have cancelled other pending runs
      - name: Point every alias tag at the newest version it covers
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-image-aliases.sh "$IMAGE"
